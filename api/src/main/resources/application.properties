spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/includedlives_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
server.port=${PORT:8080}
server.error.include-message=never

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.timeout=60m
spring.datasource.hikari.maximum-pool-size=10
server.forward-headers-strategy=framework

# Recuperacao de senha
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
